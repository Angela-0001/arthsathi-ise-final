version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arthsathi
      POSTGRES_PASSWORD: arthsathi
      POSTGRES_DB: arthsathi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./backend/ml/checkpoints:/app/ml/checkpoints

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: ./frontend/.env
    depends_on:
      - backend

  bot:
    build: ./bot
    ports:
      - "3001:3001"
    env_file: ./bot/.env
    depends_on:
      - backend

volumes:
  pgdata:
